<!doctype html><html><head><meta charset="utf-8"><title>GitHub README preview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-light.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>body{margin:0;background:#e6e6e6;font-family:system-ui}.wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:24px;padding:24px}.pane{border-radius:6px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.12)}.lbl{font:12px ui-monospace,monospace;color:#666;margin:0 0 12px}.light{background:#fff}.dark{background:#0d1117}
.dark.markdown-body{color:#e6edf3}.dark.markdown-body a{color:#4493f8}.dark.markdown-body h2{border-color:#3d444d;color:#f0f6fc}.dark.markdown-body code,.dark.markdown-body pre{background:#151b23;color:#e6edf3}.dark.markdown-body blockquote{color:#9198a1;border-color:#3d444d}.dark.markdown-body strong{color:#f0f6fc}.markdown-body{max-width:none}</style></head><body>
<div class="wrap"><div><p class="lbl">github.com/harystyleseze · light</p><article id="l" class="pane light markdown-body"></article></div><div><p class="lbl">github.com/harystyleseze · dark</p><article id="d" class="pane dark markdown-body"></article></div></div>
<script>
fetch('README.md').then(r=>r.text()).then(md=>{const h=marked.parse(md);l.innerHTML=h;d.innerHTML=h;
l.querySelectorAll('picture source').forEach(s=>s.remove());
d.querySelectorAll('picture').forEach(p=>{const s=p.querySelector('source');p.querySelector('img').src=s.getAttribute('srcset');s.remove();});});
</script></body></html>
